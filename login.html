<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - داركو CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand" style="margin-bottom:10px;">
        <div class="brand-circle">D</div>
        <div>
          <strong>Darco CRM</strong>
          <div style="color: var(--muted); font-size: 13px;">مرحبا بعودتك</div>
        </div>
      </div>
      <h1>تسجيل الدخول</h1>
      <p>أدخل بيانات حسابك للوصول إلى لوحة التحكم</p>
      <form>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="you@company.com" required>
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="•••••••" required>
        </div>
        <div class="form-group" style="align-items:center; grid-template-columns: 1fr auto;">
          <label style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="remember"> تذكرني
          </label>
          <a href="#" style="color: var(--accent); text-decoration:none;">نسيت كلمة المرور؟</a>
        </div>
        <button class="btn primary" type="submit" style="width:100%; margin-top:8px;">دخول</button>
      </form>
      <div style="margin-top:14px; font-size:14px; color:var(--muted);">
        ليس لديك حساب؟ <a href="#" style="color:var(--accent);">تواصل مع الفريق</a>
      </div>
    </div>
  </div>
</body>
</html>
